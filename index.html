<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCat — Мы переехали!</title>
    <link rel="icon" href="cat.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-hover: #5b4bc4;
            --dark: #0f172a;
            --white: #ffffff;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: #f1f5f9;
            color: var(--dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .move-card {
            background: var(--white);
            padding: 60px 40px;
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255,255,255,1);
            position: relative;
            z-index: 10;
        }

        .cat-icon {
            width: 120px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 16px;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        h1 span { color: var(--primary); }

        p {
            color: #64748b;
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .btn-move {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 20px 40px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.1rem;
            transition: var(--transition);
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-move:hover {
            transform: scale(1.05);
            background: var(--primary-hover);
            box-shadow: 0 15px 30px rgba(108, 92, 231, 0.4);
        }

        .redirect-text {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* Декоративный фон */
        .bg-circle {
            position: absolute;
            z-index: 1;
            background: var(--primary);
            filter: blur(100px);
            opacity: 0.1;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="bg-circle" style="width: 400px; height: 400px; top: -100px; right: -100px;"></div>
    <div class="bg-circle" style="width: 300px; height: 300px; bottom: -50px; left: -50px;"></div>

    <div class="move-card">
        <img src="cat.png" alt="CyberCat" class="cat-icon" onerror="this.src='https://placehold.co/120x120/6c5ce7/ffffff?text=Cat'">
        <h1>Cyber<span>Cat</span> переехал!</h1>
        <p>Мы обновили наш дом. Теперь все новости, скины и обновления v2.7 живут по новому адресу.</p>
        
        <a href="https://catgregorybale.fun/" class="btn-move">Перейти на сайт</a>
        
        <div class="redirect-text">
            Перенаправление на <b>catgregorybale.fun</b>...
        </div>
    </div>

    <script>
        // Автоматический редирект через 5 секунд
        setTimeout(() => {
            window.location.href = "https://catgregorybale.fun/";
        }, 5000);
    </script>
</body>
</html>
